version: 0.5.0
name: headlamp-click-ops
displayName: Click-Ops for Headlamp
createdAt: "2026-05-06T00:00:00Z"
description: Point-and-click cluster ops for Headlamp — build ServiceAccounts and RBAC with the cluster-scoped read Headlamp actually needs, issue expiring or long-lived kubeconfigs, audit who can reach a namespace, manage ConfigMaps and Secrets without writing YAML, protect Ingresses behind Traefik with an IP allowlist, a password and HTTPS (including ingress-nginx compatibility mode), watch live cluster resource usage, and customize Headlamp's sidebar.
